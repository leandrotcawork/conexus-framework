# Consumer pyproject — placeholder for Phase 6.4
# Depends on the conexus framework package.
[project]
name = "conexus-agents"
version = "0.1.0"
description = "Conexus consumer — Ana, Pesquisador agents"
requires-python = ">=3.11"
dependencies = [
  "conexus",
  "python-telegram-bot>=21.0",
  "ddgs>=0.1",
  "httpx>=0.27",
  "youtube-transcript-api>=1.0",
  "pypdfium2>=4.0",
  "google-auth-oauthlib>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "adapters"]
