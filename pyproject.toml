[project]
name = "conexus"
version = "0.1.0"
description = "Personal AI agent framework — Ana the secretary is the first agent"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.50",
  "python-telegram-bot>=21.0",
  "apscheduler>=3.10",
  "ddgs>=0.1",
  "httpx>=0.27",
  "youtube-transcript-api>=1.0",
  "pypdfium2>=4.0",
  "google-api-python-client>=2.130",
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "tenacity>=8.3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.14",
  "freezegun>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
