[project]
name = "conexus"
version = "0.1.0"
description = "Python agent framework — multi-agent orchestration, skills, trifecta, and MCP"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.50",
  "tenacity>=8.3",
  "pydantic>=2.7",
  "apscheduler>=3.10",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "fastmcp>=0.5",
  "httpx>=0.28.1",
  "cryptography>=46.0.7",
  "pyjwt>=2.12.1",
  "fastapi[standard]>=0.136.1",
  "uvicorn>=0.46.0",
]

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.130",
  "google-auth>=2.29",
]
telegram = [
  "python-telegram-bot>=21.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.14",
  "freezegun>=1.5",
  "ruff>=0.15.12",
  "pytest-httpx>=0.36.2",
]

[project.scripts]
conexus = "conexus.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conexus"]

[tool.pytest.ini_options]
testpaths = ["src/conexus/tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
markers = ["slow: marks tests that build wheels or create venvs (run with -m slow)"]
