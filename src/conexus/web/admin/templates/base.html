<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }} · Conexus Studio</title>
  <link rel="stylesheet" href="/admin/static/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: {
        sans: ['Inter', 'system-ui', 'sans-serif'],
        mono: ['"Fira Code"', 'ui-monospace', 'monospace'],
      }}}
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

  <!-- Top nav -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 px-5 py-0 flex items-center gap-6 h-14 shadow-sm">
    <!-- Brand -->
    <a href="/admin/" class="flex items-center gap-2 shrink-0 font-semibold text-slate-900 text-[15px]">
      <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
      </svg>
      Conexus Studio
    </a>

    <!-- Nav links -->
    <nav class="flex items-center gap-1 text-sm font-medium text-slate-600 flex-1">
      <a href="/admin/" class="px-3 py-1.5 rounded-md hover:bg-slate-100 hover:text-slate-900 transition-colors">Agents</a>
      <a href="/admin/connectors" class="px-3 py-1.5 rounded-md hover:bg-slate-100 hover:text-slate-900 transition-colors">Connectors</a>
      <a href="/admin/connections" class="px-3 py-1.5 rounded-md hover:bg-slate-100 hover:text-slate-900 transition-colors">Connections</a>
    </nav>

    <!-- Cmd+K hint -->
    <button onclick="document.dispatchEvent(new KeyboardEvent('keydown',{key:'k',ctrlKey:true}))"
            class="hidden md:flex items-center gap-1.5 text-xs text-slate-400 border border-slate-200 rounded-md px-2 py-1 hover:bg-slate-50 transition-colors">
      <kbd class="font-mono">⌘K</kbd>
    </button>
  </header>

  <!-- Page content -->
  <main class="p-6 max-w-screen-xl mx-auto">{% block content %}{% endblock %}</main>

  <!-- Cmd+K palette -->
  <script src="/admin/static/cmdk.js"></script>
  <div x-data="cmdkPalette()" x-cloak>
    <div x-show="open" @click="open=false"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         class="fixed inset-0 bg-black/40 flex items-start justify-center pt-24 z-50">
      <div @click.stop x-transition:enter="transition ease-out duration-150"
           x-transition:enter-start="opacity-0 -translate-y-2"
           x-transition:enter-end="opacity-100 translate-y-0"
           class="w-full max-w-md bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center gap-2">
          <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 111 11a6 6 0 0116 0z"/>
          </svg>
          <input x-ref="q" x-model="q" placeholder="Type a command…"
                 class="flex-1 text-sm outline-none bg-transparent text-slate-900 placeholder-slate-400">
          <kbd class="text-xs text-slate-400 font-mono">ESC</kbd>
        </div>
        <ul class="py-1 max-h-64 overflow-auto">
          <template x-for="c in filtered()" :key="c.label">
            <li @click="c.go()" x-text="c.label"
                class="px-4 py-2.5 cursor-pointer text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors"></li>
          </template>
          <template x-if="filtered().length === 0">
            <li class="px-4 py-3 text-sm text-slate-400 text-center">No commands found</li>
          </template>
        </ul>
      </div>
    </div>
  </div>

</body>
</html>
