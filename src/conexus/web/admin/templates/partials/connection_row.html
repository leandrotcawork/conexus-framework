<tr class="table-row">
  <td class="px-4 py-3 font-mono text-xs text-slate-700 max-w-[220px] truncate" title="{{ r.server_url }}">{{ r.server_url }}</td>
  <td class="px-4 py-3 text-sm text-slate-600">{{ r.user_id }}</td>
  <td class="px-4 py-3 text-xs text-slate-500">{{ fmt_epoch(r.expires_at) if r.expires_at else "—" }}</td>
  <td class="px-4 py-3">
    {% if r.status == "ok" %}
      <span class="badge badge-ok">
        <span class="status-dot status-dot-ok"></span> ok
      </span>
    {% elif r.status == "expiring" %}
      <span class="badge badge-expiring">
        <span class="status-dot status-dot-expiring"></span> expiring
      </span>
    {% else %}
      <span class="badge badge-expired">
        <span class="status-dot status-dot-expired"></span> expired
      </span>
    {% endif %}
  </td>
  <td class="px-4 py-3">
    <div class="flex flex-wrap gap-1">
      {% for s in r.scopes %}
      <span class="text-xs bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-mono">{{ s }}</span>
      {% endfor %}
    </div>
  </td>
  <td class="px-4 py-3 text-right">
    <form method="post" action="/admin/connections/{{ r.server_url }}/reauth">
      <button type="submit"
              class="text-xs text-indigo-600 hover:text-indigo-800 hover:underline transition-colors">
        Reauth
      </button>
    </form>
  </td>
</tr>
