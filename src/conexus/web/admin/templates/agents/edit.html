{% extends "base.html" %}
{% block content %}
<div class="max-w-screen-xl mx-auto">
  <!-- Header row -->
  <div class="flex items-center gap-3 mb-5">
    <a href="/admin/" class="text-slate-400 hover:text-slate-600 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <h2 class="text-lg font-semibold text-slate-900 font-mono">{{ agent.name }}</h2>
    <span class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-mono">{{ fm.llm.model if fm.llm else '' }}</span>
  </div>

  <!-- Three-column layout -->
  <div class="grid grid-cols-12 gap-5">

    <!-- Main form (col 7) -->
    <section class="col-span-12 lg:col-span-7">
      <div class="card p-5">
        <form
          id="agent-form"
          method="post" action="/admin/agents/{{ agent.name }}"
          hx-post="/admin/agents/{{ agent.name }}/preview"
          hx-trigger="input from:input delay:350ms, input from:textarea delay:350ms, change from:select delay:200ms"
          hx-target="#yaml-preview" hx-swap="innerHTML">
          {% include "partials/agent_form.html" %}
        </form>
      </div>

      <!-- REPL panel -->
      <div class="card p-4 mt-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-slate-700 flex items-center gap-1.5">
            <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3"/>
            </svg>
            Test agent
          </h3>
          <button hx-post="/admin/agents/{{ agent.name }}/test/reset"
                  hx-on::after-request="document.getElementById('repl-log').innerHTML=''"
                  class="text-xs text-slate-400 hover:text-slate-600 transition-colors flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            Reset
          </button>
        </div>
        <div id="repl-log" class="min-h-[80px] max-h-56 overflow-auto space-y-1 mb-3 border border-slate-100 rounded-lg p-2 bg-slate-50"></div>
        <form hx-post="/admin/agents/{{ agent.name }}/test"
              hx-target="#repl-log" hx-swap="beforeend"
              hx-on::after-request="this.reset(); document.getElementById('repl-log').scrollTop=9999">
          <div class="flex gap-2">
            <input name="message" required placeholder="Send a message…"
                   class="input flex-1 text-sm" autocomplete="off">
            <button type="submit" class="btn-primary text-sm px-3">Send</button>
          </div>
        </form>
      </div>
    </section>

    <!-- YAML preview pane (col 5) -->
    <aside class="col-span-12 lg:col-span-5">
      <div class="sticky top-[4.5rem]">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium text-slate-500 uppercase tracking-wide">SKILL.md preview</span>
          <span class="text-xs text-slate-400">live · 350ms delay</span>
        </div>
        <div id="yaml-preview" class="yaml-pane">{{ raw_skill_md }}</div>
      </div>
    </aside>

  </div>
</div>
{% endblock %}
