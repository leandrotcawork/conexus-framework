{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="mb-6">
    <a href="/admin/" class="text-sm text-slate-500 hover:text-slate-700 flex items-center gap-1">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to agents
    </a>
  </div>

  <div class="card p-6">
    <h2 class="text-lg font-semibold text-slate-900 mb-1">New agent</h2>
    <p class="text-sm text-slate-500 mb-5">Creates a new agent folder under <code class="text-xs bg-slate-100 px-1.5 py-0.5 rounded">agents/</code>.</p>

    <form method="post" action="/admin/agents/new" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">
          Name <span class="text-red-500">*</span>
        </label>
        <input id="name" name="name" required pattern="[a-z][a-z0-9_]*"
               placeholder="e.g. ana, pesquisador"
               class="input font-mono">
        <p class="mt-1 text-xs text-slate-400">Lowercase letters, digits, underscores. Starts with a letter.</p>
      </div>

      <div>
        <label for="template" class="block text-sm font-medium text-slate-700 mb-1">Template</label>
        <select id="template" name="template" class="input">
          {% for t in templates %}
          <option value="{{ t }}">{{ t }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="pt-2 flex items-center gap-3">
        <button type="submit" class="btn-primary">Create agent</button>
        <a href="/admin/" class="btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
