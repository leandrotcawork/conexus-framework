# Framework pyproject — placeholder for Phase 6.4
# Do not rename to pyproject.toml until Phase 6.4 completes.
[project]
name = "conexus"
version = "0.1.0"
description = "Conexus agent framework — kernel, registries, LLM, memory"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.50",
  "tenacity>=8.3",
  "pydantic>=2.7",
  "apscheduler>=3.10",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "google-api-python-client>=2.130",
  "google-auth>=2.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conexus"]
